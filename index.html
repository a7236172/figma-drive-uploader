<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Storage.to Uploader</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: #ffffff;
      border-radius: 16px;
      padding: 32px 24px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .header {
      text-align: center;
    }

    .header h2 {
      font-size: 20px;
      font-weight: 600;
      color: #111827;
      margin-bottom: 6px;
    }

    .header p {
      font-size: 13px;
      color: #6b7280;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: #2563eb;
      color: #ffffff;
      font-size: 15px;
      font-weight: 500;
      padding: 12px 20px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      width: 100%;
    }

    .btn:hover {
      background-color: #1d4ed8;
    }

    .btn:disabled {
      background-color: #9ca3af;
      cursor: not-allowed;
    }

    .drop-zone {
      border: 2px dashed #cbd5e1;
      border-radius: 12px;
      padding: 36px 20px;
      text-align: center;
      background-color: #f8fafc;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .drop-zone:hover, .drop-zone.dragover {
      border-color: #2563eb;
      background-color: #eff6ff;
    }

    .drop-zone svg {
      width: 42px;
      height: 42px;
      color: #64748b;
      transition: color 0.2s ease;
    }

    .drop-zone:hover svg, .drop-zone.dragover svg {
      color: #2563eb;
    }

    .drop-zone-text {
      font-size: 14px;
      font-weight: 500;
      color: #334155;
    }

    .drop-zone-text span {
      color: #2563eb;
      text-decoration: underline;
    }

    .drop-zone-subtext {
      font-size: 12px;
      color: #94a3b8;
    }

    .file-badge {
      display: none;
      align-items: center;
      background-color: #e0f2fe;
      color: #0369a1;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 13px;
      word-break: break-all;
    }

    #status {
      font-size: 13px;
      text-align: center;
      min-height: 20px;
      word-break: break-all;
    }

    .success {
      color: #059669 !important;
      font-weight: 500;
    }

    .error {
      color: #dc2626 !important;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h2>檔案上傳</h2>
      <p>支援點擊選擇或直接拖曳檔案進來</p>
    </div>

    <div id="uploadSection" style="display: flex; flex-direction: column; gap: 16px;">
      <input type="file" id="filePicker" style="display: none;" />

      <div class="drop-zone" id="dropZone" tabindex="0" role="button" aria-label="選擇檔案">
        <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 16.5V9.75m0 0l3 3m-3-3l-3 3M6.75 19.5a4.5 4.5 0 01-1.41-8.775 5.25 5.25 0 0110.233-2.33 3 3 0 013.758 3.848A3.752 3.752 0 0118 19.5H6.75z"/>
        </svg>
        <div class="drop-zone-text">Drop your file here or <span>browse</span></div>
        <div class="drop-zone-subtext">支援任何格式檔案</div>
      </div>

      <div class="file-badge" id="fileBadge"></div>
      <button id="uploadBtn" class="btn">開始上傳</button>
    </div>

    <div id="status"></div>
  </div>

  <script>
    const STORAGE_TO_API_URL = 'https://storage.to/api/upload';
    const STORAGE_TO_API_KEY = '965|bbhLpjC23n3rkFGQbc9cki2MQrhoajMeRlHjzVbP';
    const STORAGE_TO_UPLOAD_FIELD = 'file';

    let selectedFile = null;
    let uploading = false;

    const uploadBtn = document.getElementById('uploadBtn');
    const statusEl = document.getElementById('status');
    const filePicker = document.getElementById('filePicker');
    const dropZone = document.getElementById('dropZone');
    const fileBadge = document.getElementById('fileBadge');

    function setStatus(message, type = '') {
      statusEl.className = type;
      statusEl.innerText = message;
    }

    async function uploadToStorage(file) {
      const formData = new FormData();
      formData.append(STORAGE_TO_UPLOAD_FIELD, file, file.name);

      const headers = {
        Accept: 'application/json'
      };

      if (STORAGE_TO_API_KEY && STORAGE_TO_API_KEY !== '965|bbhLpjC23n3rkFGQbc9cki2MQrhoajMeRlHjzVbP') {
        headers.Authorization = `Bearer ${STORAGE_TO_API_KEY}`;
        headers['X-API-Key'] = STORAGE_TO_API_KEY;
      }

      const response = await fetch(STORAGE_TO_API_URL, {
        method: 'POST',
        headers,
        body: formData
      });

      const contentType = response.headers.get('content-type') || '';
      const isJson = contentType.includes('application/json');
      const payload = isJson ? await response.json() : await response.text();

      if (!response.ok) {
        const message = (payload && payload.error && payload.error.message) ||
          (payload && payload.message) ||
          `上傳失敗 (${response.status})`;
        throw new Error(message);
      }

      return payload;
    }

    function updateSelectedFile(file) {
      if (!file) return;
      selectedFile = file;
      fileBadge.style.display = 'block';
      fileBadge.innerText = `已選取：${file.name} (${(file.size / 1024).toFixed(1)} KB)`;
      setStatus('', '');
    }

    async function uploadSelectedFile() {
      if (!selectedFile || uploading) return;

      uploading = true;
      uploadBtn.disabled = true;
      setStatus(`正在上傳「${selectedFile.name}」中...`);

      try {
        const result = await uploadToStorage(selectedFile);

        const uploadedUrl = result?.url || result?.file_url || result?.data?.url || result?.download_url || result?.link || result?.path || result?.file?.url || result?.result?.url;

        if (uploadedUrl) {
          setStatus(`上傳成功：${uploadedUrl}`, 'success');
        } else if (result && result.id) {
          setStatus(`上傳成功，檔案 ID：${result.id}`, 'success');
        } else if (result && result.name) {
          setStatus(`上傳成功：${result.name}`, 'success');
        } else {
          setStatus('上傳成功', 'success');
        }

        selectedFile = null;
        filePicker.value = '';
        fileBadge.style.display = 'none';
      } catch (err) {
        setStatus(`上傳失敗：${err && err.message ? err.message : '未知錯誤'}`, 'error');
      } finally {
        uploading = false;
        uploadBtn.disabled = false;
      }
    }

    uploadBtn.addEventListener('click', async () => {
      if (!selectedFile) {
        setStatus('請先拖入或選取檔案', 'error');
        return;
      }
      await uploadSelectedFile();
    });

    dropZone.addEventListener('click', () => filePicker.click());
    dropZone.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        filePicker.click();
      }
    });

    filePicker.addEventListener('change', (e) => {
      const file = e.target.files && e.target.files[0];
      if (file) {
        updateSelectedFile(file);
        uploadSelectedFile();
      }
    });

    ['dragenter', 'dragover'].forEach((eventName) => {
      dropZone.addEventListener(eventName, (e) => {
        e.preventDefault();
        e.stopPropagation();
        dropZone.classList.add('dragover');
      });
    });

    ['dragleave', 'drop'].forEach((eventName) => {
      dropZone.addEventListener(eventName, (e) => {
        e.preventDefault();
        e.stopPropagation();
        dropZone.classList.remove('dragover');
      });
    });

    dropZone.addEventListener('drop', (e) => {
      const dt = e.dataTransfer;
      if (dt && dt.files && dt.files.length > 0) {
        const file = dt.files[0];
        updateSelectedFile(file);
        uploadSelectedFile();
      }
    });

    setStatus('選擇或拖曳檔案即可立即上傳', '');
  </script>
</body>
</html>
