<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Drive Uploader</title>
  <!-- 載入 Google 官方 Identity Services SDK -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      min-height: 100vh;
    }
    .container {
      width: 100%;
      max-width: 480px;
      background: #ffffff;
      border-radius: 16px;
      padding: 32px 24px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .header {
      text-align: center;
    }
    .header h2 {
      font-size: 20px;
      font-weight: 600;
      color: #111827;
      margin-bottom: 6px;
    }
    .header p {
      font-size: 13px;
      color: #6b7280;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: #2563eb;
      color: #ffffff;
      font-size: 15px;
      font-weight: 500;
      padding: 12px 20px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      width: 100%;
    }
    .btn:hover {
      background-color: #1d4ed8;
    }
    .btn:disabled {
      background-color: #9ca3af;
      cursor: not-allowed;
    }
    /* 拖曳上傳核心卡片區塊 */
    .drop-zone {
      border: 2px dashed #cbd5e1;
      border-radius: 12px;
      padding: 36px 20px;
      text-align: center;
      background-color: #f8fafc;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .drop-zone:hover, .drop-zone.dragover {
      border-color: #2563eb;
      background-color: #eff6ff;
    }
    .drop-zone svg {
      width: 42px;
      height: 42px;
      color: #64748b;
      transition: color 0.2s ease;
    }
    .drop-zone:hover svg, .drop-zone.dragover svg {
      color: #2563eb;
    }
    .drop-zone-text {
      font-size: 14px;
      font-weight: 500;
      color: #334155;
    }
    .drop-zone-text span {
      color: #2563eb;
      text-decoration: underline;
    }
    .drop-zone-subtext {
      font-size: 12px;
      color: #94a3b8;
    }
    .file-badge {
      display: none;
      align-items: center;
      background-color: #e0f2fe;
      color: #0369a1;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 13px;
      word-break: break-all;
    }
    #status {
      font-size: 13px;
      text-align: center;
      min-height: 20px;
      word-break: break-all;
    }
    .success {
      color: #059669 !important;
      font-weight: 500;
    }
    .error {
      color: #dc2626 !important;
      font-weight: 500;
    }
  </style>
</head>
<body>
    
  <div class="container">
    <div class="header">
      <h2>檔案上傳至雲端硬碟</h2>
      <p>支援點擊選擇或直接拖曳檔案進來</p>
    </div>
    <button id="authBtn" class="btn">連結 Google 帳戶並授權</button>

    <div id="uploadSection" style="display: none; flex-direction: column; gap: 16px;">
      <input type="file" id="filePicker" style="display: none;" />
      <div class="drop-zone" id="dropZone">
        <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 16.5V9.75m0 0l3 3m-3-3l-3 3M6.75 19.5a4.5 4.5 0 01-1.41-8.775 5.25 5.25 0 0110.233-2.33 3 3 0 013.758 3.848A3.752 3.752 0 0118 19.5H18.75A3.75 3.75 0 0115 23.25h-6A3.75 3.75 0 015.25 19.5"/>
        </svg>
        <div class="drop-zone-text">Drop your file here or <span>browse</span></div>
        <div class="drop-zone-subtext">支援任何格式檔案</div>
      </div>
      <div class="file-badge" id="fileBadge"></div>
      <button id="uploadBtn" class="btn">開始上傳</button>
    </div>
    <div id="status"></div>
  </div>
<script>
    const CLIENT_ID = '453798667636-jo36dfp87te7s1kjed4fs9qp9up9e9ds.apps.googleusercontent.com';
    const FOLDER_ID = '11IDs7Uyuhe6QUdeXjKtulWKKNvaBWSc4';
    const SCOPES = 'https://www.googleapis.com/auth/drive.file';
    
    let tokenClient;
    let accessToken = null;
    let selectedFile = null;
    const authBtn = document.getElementById('authBtn');
    const uploadBtn = document.getElementById('uploadBtn');
    const uploadSection = document.getElementById('uploadSection');
    const statusEl = document.getElementById('status');
    const filePicker = document.getElementById('filePicker');
    const dropZone = document.getElementById('dropZone');
    const fileBadge = document.getElementById('fileBadge');
    window.onload = function() {
      if (typeof google === 'undefined') {
        statusEl.className = 'error';
        statusEl.innerText = '無法載入 Google 驗證模組，請檢查網路連線。';
        return;
      }
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: SCOPES,
        callback: (tokenResponse) => {
          if (tokenResponse && tokenResponse.access_token) {
            accessToken = tokenResponse.access_token;
            statusEl.className = 'success';
            statusEl.innerText = '授權完成！請拖曳或選取檔案。';
            authBtn.style.display = 'none';
            uploadSection.style.display = 'flex';
          } else if (tokenResponse.error) {
            statusEl.className = 'error';
            statusEl.innerText = '授權失敗：' + tokenResponse.error;
          }
          },
      });
    };
  authBtn.addEventListener('click', () => {
      statusEl.className = '';
      statusEl.innerText = '等待授權完成...';
      tokenClient.requestAccessToken({ prompt: '' });
    });
  function handleFile(file) {
      if (!file) return;
      selectedFile = file;
      fileBadge.style.display = 'block';
      fileBadge.innerText = `已選取：${file.name} (${(file.size / 1024).toFixed(1)} KB)`;
      statusEl.innerText = '';
    }
  dropZone.addEventListener('click', () => filePicker.click());

    filePicker.addEventListener('change', (e) => {
      if (e.target.files.length > 0) {
        handleFile(e.target.files[0]);
      }
    });

      ['dragenter', 'dragover'].forEach(eventName => {
      dropZone.addEventListener(eventName, (e) => {
        e.preventDefault();
        e.stopPropagation();
        dropZone.classList.add('dragover');
      });
    });
    ['dragleave', 'drop'].forEach(eventName => {
      dropZone.addEventListener(eventName, (e) => {
        e.preventDefault();
        e.stopPropagation();
        dropZone.classList.remove('dragover');
      });
    });
    dropZone.addEventListener('drop', (e) => {
      const dt = e.dataTransfer;
      if (dt.files && dt.files.length > 0) {
        handleFile(dt.files[0]);
      }
    });

      uploadBtn.addEventListener('click', async () => {
      if (!selectedFile) {
        alert('請先拖入或選取檔案');
        return;
      }
      if (!accessToken) {
        alert('尚未取得授權');
        return;
      }

    uploadBtn.disabled = true;
    statusEl.className = '';
    statusEl.innerText = `正在上傳「${selectedFile.name}」中...`;
    const metadata = {
        name: selectedFile.name,
        mimeType: selectedFile.type || 'application/octet-stream',
        parents: [FOLDER_ID]
      };
    const boundary = 'foo_bar_baz_delimiter';
    const delimiter = `\r\n--${boundary}\r\n`;
    const closeDelim = `\r\n--${boundary}--`;
    const reader = new FileReader();
    reader.readAsArrayBuffer(selectedFile);
    reader.onload = async () => {
      const fileContent = reader.result;
      const metadataBlob = new Blob([
          delimiter +
          'Content-Type: application/json; charset=UTF-8\r\n\r\n' +
          JSON.stringify(metadata) +
          delimiter +
          `Content-Type: ${metadata.mimeType}\r\n\r\n`
        ]);
    const fullPayload = new Blob([metadataBlob, fileContent, closeDelim]);

        try {
          const res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
            method: 'POST',
            headers: {
              'Authorization': `Bearer ${accessToken}`,
              'Content-Type': `multipart/related; boundary=${boundary}`
            },
            body: fullPayload
          });
          const data = await res.json();
          if (res.ok) {
            statusEl.className = 'success';
            statusEl.innerHTML = `上傳成功！檔案名稱：${data.name}`;
            selectedFile = null;
            fileBadge.style.display = 'none';
            filePicker.value = '';
          } else {
            statusEl.className = 'error';
            statusEl.innerText = `上傳失敗：${data.error ? data.error.message : '未知錯誤'}`;
          }
        } catch (err) {
          statusEl.className = 'error';
          statusEl.innerText = `連線錯誤：${err.message}`;
          } finally {
          uploadBtn.disabled = false;
        }
      };
    });
  </script>
</body>
</html>
